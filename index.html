<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Omer!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Happy Birthday!</h1>
        <!-- The JS will inject the candle numbers here -->
        <div id="candle-countdown" class="countdown-container"></div>
    </header>

    <main>
        <section class="gallery-section">
            <h2>Level 1: The Early Years</h2>
            <div class="photo-grid">
                <!-- 6 Kid Photo Slots -->
                <div class="pixel-frame"><img src="photos/kid1.jpg" alt="Kid Photo 1"></div>
                <div class="pixel-frame"><img src="photos/kid2.jpg" alt="Kid Photo 2"></div>
                <div class="pixel-frame"><img src="photos/kid3.jpg" alt="Kid Photo 3"></div>
                <div class="pixel-frame"><img src="photos/kid4.jpg" alt="Kid Photo 4"></div>
                <div class="pixel-frame"><img src="photos/kid5.jpg" alt="Kid Photo 5"></div>
                <div class="pixel-frame"><img src="photos/kid6.jpg" alt="Kid Photo 6"></div>
            </div>
        </section>

        <section class="gallery-section">
            <h2>Level Up: Current Stats</h2>
            <div class="photo-grid">
                <!-- 6 Adult Photo Slots -->
                <div class="pixel-frame"><img src="photos/adult1.jpg" alt="Adult Photo 1"></div>
                <div class="pixel-frame"><img src="photos/adult2.jpg" alt="Adult Photo 2"></div>
                <div class="pixel-frame"><img src="photos/adult3.jpg" alt="Adult Photo 3"></div>
                <div class="pixel-frame"><img src="photos/adult4.jpg" alt="Adult Photo 4"></div>
                <div class="pixel-frame"><img src="photos/adult5.jpg" alt="Adult Photo 5"></div>
                <div class="pixel-frame"><img src="photos/adult6.jpg" alt="Adult Photo 6"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
